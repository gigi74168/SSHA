ssh.key.changed_explain:
  en: "This can happen after the server was reinstalled, or indicate a network interception (MITM)."
  fr: "Cela peut arriver après une réinstallation du serveur, ou indiquer une interception réseau (MITM)."
  ru: "Такое бывает после переустановки сервера, но может означать и перехват трафика (MITM)."
  uk: "Таке буває після перевстановлення сервера, але може означати й перехоплення трафіку (MITM)."
  es: "Puede ocurrir tras reinstalar el servidor, o indicar una interceptación de red (MITM)."
  it: "Può succedere dopo una reinstallazione del server, oppure indicare un'intercettazione di rete (MITM)."
ssh.key.accept_prompt:
  en: "Accept and update the fingerprint? [y/N]:"
  fr: "Accepter et mettre à jour l'empreinte ? [o/N] :"
  ru: "Принять и обновить отпечаток? [д/Н]:"
  uk: "Прийняти та оновити відбиток? [т/Н]:"
  es: "¿Aceptar y actualizar la huella? [s/N]:"
  it: "Accettare e aggiornare l'impronta? [s/N]:"
ssh.key.tofu:
  en: "New fingerprint saved for %{host} (%{algorithm}, %{fingerprint})"
  fr: "Nouvelle empreinte enregistrée pour %{host} (%{algorithm}, %{fingerprint})"
  ru: "Сохранён новый отпечаток для %{host} (%{algorithm}, %{fingerprint})"
