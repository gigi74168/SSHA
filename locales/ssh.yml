  es: "Nueva huella guardada para %{host} (%{algorithm}, %{fingerprint})"
  it: "Nuova impronta salvata per %{host} (%{algorithm}, %{fingerprint})"
ssh.key.changed_short:
  en: "the server host key has changed — connect once manually to review it"
  fr: "la clé du serveur a changé — connecte-toi une fois manuellement pour la vérifier"
  ru: "ключ сервера изменился — подключитесь вручную, чтобы проверить его"
  uk: "ключ сервера змінився — підключіться вручну, щоб перевірити його"
  es: "la clave del servidor ha cambiado — conéctate una vez manualmente para revisarla"
  it: "la chiave del server è cambiata — connettiti una volta manualmente per verificarla"

